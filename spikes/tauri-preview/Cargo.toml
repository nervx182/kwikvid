# Throwaway spike for issue #5 (preview path in Tauri 2). Not a workspace
# member: the merge gate never builds it. See README.md.
[package]
name = "kv-preview-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "25"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSGraphics", "objc2-core-foundation"] }

[profile.release]
debug = false
