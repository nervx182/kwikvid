# cargo-deny configuration. Keeps every dependency compatible with a later
# open-source release. See docs/decisions/0005-dependency-licenses.md.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
]
# The only maintained safe FFmpeg bindings (ffmpeg-next and its -sys crate)
# are WTFPL, a public-domain-style permissive licence. Scoped to these two
# crates rather than allowed globally. The FFmpeg libraries they link are a
# separate matter: shipping builds must use an LGPL build (ADR 0005).
exceptions = [
  { crate = "ffmpeg-next", allow = ["WTFPL"] },
  { crate = "ffmpeg-sys-next", allow = ["WTFPL"] },
]
# Fonts are files, not crates, so cargo-deny never sees them: the bundled
# title font (assets/fonts/, SIL OFL 1.1) was checked by hand; licence and
# source are recorded in assets/fonts/SOURCES.md.
# Our own crates are unpublished and unlicensed for now.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
