[workspace]
resolver = "2"
members = ["crates/*"]
# Spikes are throwaway experiments with their own lockfile; never built by the gate.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
hound = "3.5"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Fixture generation (tagged clips, click tracks) runs in many gate tests.
[profile.dev.package.kv-testkit]
opt-level = 2
