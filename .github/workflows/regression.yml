# Full regression suite. Manually dispatched: Actions tab > regression > Run
# workflow, or `gh workflow run regression.yml --ref <branch> -f suite=all`.
# See AGENTS.md ("Full regression suite") and docs/decisions/0008-regression-corpus.md.
name: regression

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suites to run"
        type: choice
        default: all
        options: [all, quality, beats, performance, platforms]
      file_issue:
        description: "File a Task issue when a job fails"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every test, including `#[ignore = "regression"]` ones, on all three OSes.
  # Corpus tests skip cleanly while the corpus is empty or not fetched.
  platforms:
    if: inputs.suite == 'all' || inputs.suite == 'platforms'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Fetch only the corpus LFS objects, cached by manifest hash so repeat
      # runs do not spend LFS bandwidth (ADR 0008).
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-corpus-${{ hashFiles('fixtures/corpus.toml') }}
      - name: Fetch regression corpus (Git LFS)
        shell: bash
        run: git lfs install --local && git lfs pull --include "fixtures/corpus/**"
      # kv-media links the system FFmpeg >= 6.1 (ffmpeg-next) and needs libclang
      # for bindgen; see crates/kv-media/README.md. All three are GPL builds:
      # fine for CI, never for shipping (ADR 0005). The kv-media tests encode
      # their fixtures with libx264, libx265 (10-bit) and aac, so each OS needs
      # an FFmpeg that has them.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev pkg-config clang libclang-dev
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install ffmpeg pkgconf
      # Windows: BtbN's prebuilt shared win64 build of the newest FFmpeg
      # release branch (n7.x/n8.x, never master): headers, MSVC import
      # libraries, DLLs. BtbN renames assets as branches come and go, so the
      # asset is picked from the release listing rather than hard-coded.
      # ffmpeg-sys-next finds it through FFMPEG_DIR; the DLLs go on PATH for
      # the test binaries. The runner image ships LLVM for bindgen.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest' `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'kwikvid-ci' }
          $asset = $rel.assets |
            Where-Object { $_.name -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-shared-[\d.]+\.zip$' } |
            Sort-Object { [version]($_.name -replace '^ffmpeg-n(\d+\.\d+)-.*$', '$1') } -Descending |
            Select-Object -First 1
          if (-not $asset) {
            $rel.assets.name
            throw 'no ffmpeg-n*-latest-win64-gpl-shared asset in BtbN/FFmpeg-Builds latest'
          }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          Get-ChildItem "$dir\lib" | Select-Object -ExpandProperty Name
          & "$dir\bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "$dir\bin" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --locked -- --include-ignored

  # Criterion benchmarks on Apple Silicon (the primary target). Results are
  # uploaded as an artifact; there is no pass/fail threshold yet.
  benchmarks:
    if: inputs.suite == 'all' || inputs.suite == 'performance'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-corpus-${{ hashFiles('fixtures/corpus.toml') }}
      - name: Fetch regression corpus (Git LFS)
        run: git lfs install --local && git lfs pull --include "fixtures/corpus/**"
      # Same as the platforms job: kv-media needs the system FFmpeg.
      - name: Install FFmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install ffmpeg pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench
        run: |
          set -o pipefail
          cargo bench --workspace --locked --bench '*' 2>&1 | tee bench-output.txt
      # `TARGET <name> <measured_ms> <target_ms>` lines (AGENTS.md, "Full
      # regression suite") as a table. Reported only: a missed target does
      # not fail the job (the virtual runner's numbers are noisy).
      - name: Performance targets
        if: always()
        run: |
          {
            echo '## Performance targets'
            echo
            echo '| Target | Measured (ms) | Budget (ms) | Result |'
            echo '|---|---:|---:|---|'
            awk '$1 == "TARGET" && NF == 4 { printf "| %s | %s | %s | %s |\n", $2, $3, $4, ($3 + 0 <= $4 + 0) ? "pass" : "**FAIL**" }' bench-output.txt 2>/dev/null || true
            grep -q '^TARGET ' bench-output.txt 2>/dev/null || echo '| (no TARGET lines in bench-output.txt) | | | |'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Benchmark summary
        if: always()
        run: |
          { echo '## Benchmarks'; echo '```'; grep -E -B1 'time:' bench-output.txt | grep -v -- '^--$' || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The summary above already holds the numbers, so a full artifact store
      # (account-wide quota) must not fail the regression run.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 30
          name: criterion-${{ github.run_id }}
          path: |
            target/criterion
            bench-output.txt
          if-no-files-found: warn

  # Turns a genuine failure (not a cancellation or skip) into a Task issue.
  report:
    needs: [platforms, benchmarks]
    if: always() && inputs.file_issue && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REF: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      SUITE: ${{ inputs.suite }}
    steps:
      - name: File a Task issue for the failing jobs
        run: |
          set -euo pipefail
          jobs=$(gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | [.databaseId, .name, .url] | @tsv')
          failed=$(printf '%s\n' "$jobs" | awk -F'\t' '{print "- " $2 ": " $3}')
          names=$(printf '%s\n' "$jobs" | cut -f2 | paste -sd, - | sed 's/,/, /g')
          # The run is still in progress (this job is part of it), so read each
          # failed job's log through the jobs API rather than `gh run view --log`.
          excerpt=""
          while IFS=$'\t' read -r id name _; do
            [ -n "$id" ] || continue
            log=$(gh api "repos/$GH_REPO/actions/jobs/$id/logs" 2>/dev/null | tail -n 60 | cut -c1-300 || true)
            excerpt+="===== ${name} ====="$'\n'"${log}"$'\n'
          done <<< "$jobs"
          export TITLE="Regression failure: ${names} on ${REF}"

          existing=$(gh issue list --state open --label area:ci --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' || true)
          if [ -n "$existing" ]; then
            echo "An open issue already tracks this failure; not filing a duplicate."
            exit 0
          fi

          body=$(cat <<EOF
          ## Context
          The full regression workflow (\`.github/workflows/regression.yml\`, suite \`${SUITE}\`) failed on \`${REF}\` at ${SHA}.
          Run: ${RUN_URL}
          Filed automatically by the workflow's \`report\` job. See AGENTS.md ("Full regression suite").

          ## Goal
          The regression run passes again on \`${REF}\`.

          ## Acceptance criteria
          - [ ] Root cause found and fixed (or the test corrected, never deleted or ignored)
          - [ ] A re-dispatched regression run is green (link it)
          - [ ] Merge gate green; no new clippy warnings

          ## Where to look
          Failing jobs:
          ${failed}

          ## Test plan
          Reproduce locally with \`cargo test --workspace --release -- --include-ignored\` (or \`cargo bench\` for the benchmarks job), then re-dispatch the workflow.

          ## Out of scope
          Unrelated failures: file them separately.

          ## Dependencies
          Blocked by: none

          ## Notes
          Log excerpt (last lines of the failed steps):

          ~~~~text
          ${excerpt}
          ~~~~
          EOF
          )
          printf '%s\n' "$body" > issue-body.md
          gh issue create --title "$TITLE" --body-file issue-body.md \
            --label status:triage --label type:bug --label area:ci
