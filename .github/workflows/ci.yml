# Fast merge gate. Must stay under ~10 minutes. Required check on main: "gate".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # kv-media links the system FFmpeg (ffmpeg-next needs headers + pkg-config).
      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev pkg-config clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # kv-media links the system FFmpeg (ffmpeg-next needs headers + pkg-config).
      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev pkg-config clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # macOS minutes cost 10x on a private repo, so the Mac build runs only on
  # pushes to main and manual dispatch, not on every PR (see issue #43).
  mac-smoke:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Homebrew's ffmpeg is a GPL build: fine for CI, never for shipping (ADR 0005).
      - name: Install FFmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install ffmpeg pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --release --locked

  # Single required status check for branch protection.
  gate:
    if: always()
    needs: [lint, test, deny, mac-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: All merge-gate jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
          test "${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs.deny.result == 'success' }}" = "true"
          # mac-smoke is skipped on PRs by design; elsewhere it must succeed.
          test "${{ github.event_name == 'pull_request' || needs.mac-smoke.result == 'success' }}" = "true"
