# kv-app UI tests (ADR 0011). Not part of the merge gate (yet): see the ADR
# for how to make `playwright` a required check.
#
# - playwright: every UI behaviour, Chromium + WebKit against the static ui/
#   folder with a mock backend. Only on PRs that touch the UI or its tests.
# - tauri-smoke: one end-to-end launch of the real app under xvfb with
#   tauri-driver. Slow (Rust build), so only on pushes to main and on dispatch.
name: ui-tests

on:
  pull_request:
    paths:
      - "crates/kv-app/ui/**"
      - "crates/kv-app/ui-tests/**"
      - ".github/workflows/ui-tests.yml"
  push:
    branches: [main]
    paths:
      - "crates/kv-app/**"
      - "crates/kv-session/**"
      - "crates/kv-core/**"
      - "crates/kv-autoedit/**"
      - "Cargo.lock"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/kv-app/ui-tests

jobs:
  playwright:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/kv-app/ui-tests/package-lock.json
      - run: npm ci
      # Browsers are keyed on the lockfile (it pins the Playwright version).
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/kv-app/ui-tests/package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            crates/kv-app/ui-tests/playwright-report/
            crates/kv-app/ui-tests/test-results/
          retention-days: 7

  tauri-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Same system packages as ci.yml, plus the WebKitGTK WebDriver and xvfb.
      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev pkg-config clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev webkitgtk-webdriver xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-smoke
      - uses: actions/cache@v4
        id: tauri-driver
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}
      - if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - run: cargo build -p kv-app --locked
      - run: xvfb-run -a node smoke/tauri-smoke.mjs
