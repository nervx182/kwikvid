[package]
name = "kv-audio"
description = "kwikvid music analysis: decode, onsets, tempo and beat tracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kv-core = { path = "../kv-core" }
rubato = "4.0.0"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac"] }
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
hound.workspace = true
# `video`: MP4 clips with an AAC tone track for the clip audio tests.
kv-testkit = { path = "../kv-testkit", features = ["video"] }
