[package]
name = "kv-mcp"
description = "kwikvid MCP server: exposes the kv-core Command API to AI clients"
version.workspace = true
edition.workspace = true
# rmcp 3.x needs Rust 1.88.
rust-version = "1.88"
publish.workspace = true

[[bin]]
name = "kwikvid-mcp"
path = "src/main.rs"

[dependencies]
kv-core = { path = "../kv-core" }
kv-media = { path = "../kv-media" }
anyhow = "1"
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
