[package]
name = "kv-mcp"
description = "kwikvid MCP server: exposes the kv-core Command API to AI clients"
version.workspace = true
edition.workspace = true
# kv-session (kv-cache) needs Rust 1.89; rmcp 3.x needs 1.88.
rust-version = "1.89"
publish.workspace = true

[[bin]]
name = "kwikvid-mcp"
path = "src/main.rs"

[dependencies]
kv-core = { path = "../kv-core" }
# Default features: the binary probes media with FFmpeg.
kv-media = { path = "../kv-media" }
kv-cache = { path = "../kv-cache" }
kv-session = { path = "../kv-session" }
anyhow = "1"
# The default cache directory (`--cache`).
dirs = "7"
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
# MusicAnalysis values for the regenerate tests.
kv-audio = { path = "../kv-audio" }
# Real files for the cache keys in the import and music tests.
tempfile = "3"
# `video`: tagged MP4 clips and a click track for the FFmpeg-backed test.
kv-testkit = { path = "../kv-testkit", features = ["video"] }

[lints]
workspace = true
