[package]
name = "kv-cache"
description = "kwikvid content cache: thumbnails, probe and analysis results in one SQLite file"
version.workspace = true
edition.workspace = true
# rusqlite >= 0.41 (needed for the SQLite 3.54 fix, RUSTSEC-2026-0459) declares
# Rust 1.89, above the workspace MSRV of 1.85. The pinned toolchain is stable.
rust-version = "1.89"
publish.workspace = true

[dependencies]
# `bundled` compiles SQLite (public domain) in, so no system library is needed.
rusqlite = { version = "0.43", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
