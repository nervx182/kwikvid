[package]
name = "kv-testkit"
description = "kwikvid test fixtures: deterministic synthetic media generated on demand, plus the regression corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Tagged MP4 clip fixtures (`tagged_clip`, `tagged_clip_set`, `read_clip_tags`)
# and synthetic benchmark clips (`synthetic_clip`).
# Links the system FFmpeg, like kv-media (see README.md).
video = ["dep:ffmpeg-next"]

[dependencies]
hound.workspace = true
serde.workspace = true
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Same version and features as kv-media.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format"], optional = true }

[dev-dependencies]
# The merge gate runs `cargo test --workspace` without features; this makes
# the crate's own tests always cover the `video` feature.
kv-testkit = { path = ".", features = ["video"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# Smoke benchmark that proves the regression `benchmarks` job end to end.
[[bench]]
name = "fixtures"
harness = false

[lints]
workspace = true
