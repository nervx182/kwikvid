[package]
name = "kv-cli"
description = "kwikvid command-line interface: the `kwikvid` binary that drives the engine headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kwikvid"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kv-audio = { path = "../kv-audio" }
kv-autoedit = { path = "../kv-autoedit" }
kv-core = { path = "../kv-core" }
kv-gopro = { path = "../kv-gopro" }
kv-media = { path = "../kv-media" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
insta = "1"
kv-testkit = { path = "../kv-testkit" }
tempfile = "3"

[lints]
workspace = true
