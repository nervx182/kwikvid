[package]
name = "kv-cli"
description = "kwikvid command-line interface: the `kwikvid` binary that drives the engine headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kwikvid"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kv-audio = { path = "../kv-audio" }
kv-autoedit = { path = "../kv-autoedit" }
kv-core = { path = "../kv-core" }
kv-gopro = { path = "../kv-gopro" }
kv-media = { path = "../kv-media" }
kv-render = { path = "../kv-render" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
assert_cmd = "2"
# Same crate as kv-media; the M1 gate test decodes the exported audio.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format"] }
insta = "1"
# `video`: tagged MP4 clips for the end-to-end render test.
kv-testkit = { path = "../kv-testkit", features = ["video"] }
tempfile = "3"

[lints]
workspace = true
