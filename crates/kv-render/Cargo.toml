[package]
name = "kv-render"
description = "kwikvid rendering: frame plan (EDL to per-frame source layers, pure), CPU export compositing, the export pipeline and the wgpu preview compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["gpu"]
# wgpu compositor for the live preview (`kv_render::gpu`, ADR 0007).
gpu = ["dep:wgpu", "dep:pollster"]
# Preview audio through the default output device (`kv_render::preview::audio`).
# Always on for macOS (below); opt-in elsewhere, because on Linux cpal links
# ALSA (`libasound2-dev`), which the merge gate does not install.
cpal = ["dep:cpal"]

[dependencies]
kv-audio = { path = "../kv-audio" }
kv-core = { path = "../kv-core" }
# `Rational` and `VideoFrame`; no FFmpeg.
kv-media = { path = "../kv-media", default-features = false }
thiserror.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Pinned: the preview's GPU code is written against this exact API. MIT OR
# Apache-2.0. Native backends only (no WebGPU/WebGL, no GLES).
wgpu = { version = "=25.0.2", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"], optional = true }
# Blocks on wgpu's async adapter/device requests. MIT OR Apache-2.0.
pollster = { version = "0.4", optional = true }
# Audio output for the preview. Apache-2.0.
cpal = { version = "0.18.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"

[dev-dependencies]
proptest.workspace = true
# The export integration test runs the real FFmpeg backend on tagged clips.
kv-media = { path = "../kv-media" }
kv-testkit = { path = "../kv-testkit", features = ["video"] }
# Same version and features as kv-media; reads the exported stream lengths.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }

[lints]
workspace = true
