[package]
name = "kv-media"
description = "kwikvid platform media layer: probe (and later decode, thumbnails, export) behind MediaBackend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# FFmpeg backend. Needs the system FFmpeg development libraries (see README.md).
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
kv-core = { path = "../kv-core" }
serde.workspace = true
thiserror.workspace = true
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format"], optional = true }

[dev-dependencies]
# Same crate as the backend; the tests encode their own fixture clips.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format"] }

[lints]
workspace = true
