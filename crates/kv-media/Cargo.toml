[package]
name = "kv-media"
description = "kwikvid platform media layer: probe and decode (and later thumbnails, export) behind MediaBackend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# FFmpeg backend. Needs the system FFmpeg development libraries (see README.md).
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
kv-core = { path = "../kv-core" }
serde.workspace = true
thiserror.workspace = true
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json.workspace = true
hound.workspace = true
# Same crate as the backend; the tests encode their own fixture clips.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }
# Tagged fixture clips for the decode and encode tests.
kv-testkit = { path = "../kv-testkit", features = ["video"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# Random-seek latency of `frame_at` (issue #53); regression `benchmarks` job only.
[[bench]]
name = "seek"
harness = false
required-features = ["ffmpeg"]

[lints]
workspace = true
