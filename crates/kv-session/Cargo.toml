[package]
name = "kv-session"
description = "kwikvid desktop session: one project with undo history, a media root and UI state snapshots (Tauri-free)"
version.workspace = true
edition.workspace = true
# kv-cache needs Rust 1.89 (see its Cargo.toml).
rust-version = "1.89"
publish.workspace = true

[dependencies]
kv-audio = { path = "../kv-audio" }
kv-cache = { path = "../kv-cache" }
kv-autoedit = { path = "../kv-autoedit" }
kv-core = { path = "../kv-core" }
kv-gopro = { path = "../kv-gopro" }
# No FFmpeg: the media backend is injected (`JobContext::media`).
kv-media = { path = "../kv-media", default-features = false }
# The export pipeline; no preview GPU code.
kv-render = { path = "../kv-render", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# `video`: tagged MP4 clips for the FFmpeg import test.
kv-testkit = { path = "../kv-testkit", features = ["video"] }
# The real FFmpeg backend, for the import test only.
kv-media = { path = "../kv-media" }
# Decodes the stored JPEG thumbnails in the import test.
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
tempfile = "3"
# Same version and features as kv-media.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# Regenerate latency for 50 clips vs the Roadmap I target (issue #147);
# regression `benchmarks` job only.
[[bench]]
name = "regenerate"
harness = false

[lints]
workspace = true
