<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kwikvid</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/toast.css" />
    <link rel="stylesheet" href="css/project.css" />
    <link rel="stylesheet" href="css/timeline.css" />
    <link rel="stylesheet" href="css/autoedit.css" />
    <link rel="stylesheet" href="css/library.css" />
    <link rel="stylesheet" href="css/inspector.css" />
    <link rel="stylesheet" href="css/transport.css" />
    <link rel="stylesheet" href="css/music.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar" data-testid="toolbar">
        <span class="brand">kwikvid</span>
        <div class="toolbar-group">
          <button type="button" id="undo" data-testid="undo" title="Undo (Cmd/Ctrl+Z)" disabled>Undo</button>
          <button type="button" id="redo" data-testid="redo" title="Redo (Shift+Cmd/Ctrl+Z)" disabled>Redo</button>
        </div>
      </header>
      <aside class="pane library" data-testid="library">
        <h2>Library</h2>
        <p class="placeholder" id="library-summary"></p>
      </aside>
      <!-- Transparent on purpose: the native preview layer draws underneath (ADR 0007). -->
      <main class="viewer" data-testid="viewer" aria-label="Viewer">
        <div class="transport" data-testid="transport">
          <button type="button" id="transport-play" data-testid="transport-play" title="Play (Space)" aria-label="Play">▶</button>
          <span class="transport-readout"><b id="transport-time" data-testid="transport-time" data-position="0">0:00.00</b> / <span id="transport-length" data-testid="transport-length">0:00.00</span></span>
        </div>
        <pre class="preview-debug" id="preview-debug" data-testid="preview-debug" hidden></pre>
      </main>
      <aside class="pane inspector" data-testid="inspector">
        <h2>Inspector</h2>
        <dl id="inspector-summary"></dl>
      </aside>
      <section class="pane timeline" data-testid="timeline">
        <h2>Timeline</h2>
        <p class="placeholder" id="timeline-summary"></p>
        <div class="tl" id="timeline-view" data-testid="timeline-view" data-zoom="1">
          <div class="tl-bar">
            <span class="tl-lengths">Length <b id="timeline-length" data-testid="timeline-length">0:00.0</b> · Target <b id="timeline-target" data-testid="timeline-target">–</b></span>
            <div class="tl-zoom">
              <button type="button" id="timeline-zoom-out" data-testid="timeline-zoom-out" title="Zoom out" disabled>−</button>
              <button type="button" id="timeline-zoom-fit" data-testid="timeline-zoom-fit" title="Zoom to fit">Fit</button>
              <button type="button" id="timeline-zoom-in" data-testid="timeline-zoom-in" title="Zoom in">+</button>
            </div>
          </div>
          <p class="tl-message" id="timeline-empty" data-testid="timeline-empty" hidden></p>
          <p class="tl-error" id="timeline-error" data-testid="timeline-error" role="alert" hidden></p>
          <div class="tl-scroll" id="timeline-scroll">
            <div class="tl-content" id="timeline-content" data-testid="timeline-content">
              <div class="tl-ruler" id="timeline-ruler" data-testid="timeline-ruler" title="Click or drag to move the playhead">
                <div class="tl-beats" id="timeline-beats" data-testid="timeline-beats"></div>
              </div>
              <div class="tl-target-marker" id="timeline-target-marker" hidden></div>
              <div class="tl-track" id="timeline-track" data-testid="timeline-track"></div>
              <div class="tl-playhead" id="timeline-playhead" data-testid="timeline-playhead" data-position="0"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div class="toasts" id="toasts" data-testid="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
