[package]
name = "kv-app"
description = "kwikvid desktop app: the Tauri 2 shell, a thin IPC layer over kv-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kwikvid-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1"
kv-core = { path = "../kv-core" }
kv-session = { path = "../kv-session" }
serde.workspace = true
# macos-private-api: transparent webview over the native preview layer (ADR 0007).
tauri = { version = "2.12", features = ["macos-private-api"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
