[package]
name = "kv-app"
description = "kwikvid desktop app: the Tauri 2 shell, a thin IPC layer over kv-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kwikvid-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1"
kv-cache = { path = "../kv-cache" }
kv-core = { path = "../kv-core" }
# `VideoFrame`, plus probe, decode and filmstrips for import (FFmpeg, LGPL
# dynamic build; ADR 0005).
kv-media = { path = "../kv-media" }
# Preview compositor, `FrameSink`, `GpuContext` (ADR 0007).
kv-render = { path = "../kv-render" }
kv-session = { path = "../kv-session" }
# Blocks on wgpu's adapter/device requests (as kv-render). MIT OR Apache-2.0.
pollster = "0.4"
serde.workspace = true
# The remembered camera import folder (`camera-import.json`).
serde_json.workspace = true
# macos-private-api: transparent webview over the native preview layer (ADR 0007).
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# "Show in Finder" after an export. MIT OR Apache-2.0.
tauri-plugin-opener = "2"
# Bundled music manifest (`assets/music/manifest.toml`). MIT OR Apache-2.0.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
# Same pin and features as kv-render: the native preview layer shares its device.
wgpu = { version = "=25.0.2", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# The native preview layer: an NSView under the webview (ADR 0007).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[dev-dependencies]
kv-audio = { path = "../kv-audio" }
tempfile = "3"

[lints]
workspace = true
